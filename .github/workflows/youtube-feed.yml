name: Update YouTube feed

# Refreshes videos.json from the channel's public RSS feed so the site's
# "recent playtests" cards stay current. No API key required.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: youtube-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh videos.json
        run: python3 scripts/update_youtube_feed.py

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- videos.json; then
            echo "No feed changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "chore: refresh YouTube feed"
            git push
          fi
